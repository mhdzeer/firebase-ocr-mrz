name: ocr_mrz
description: Free on-device Passport & Bahraini CPR ID OCR using Firebase + ML Kit
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0

  image_picker: ^1.0.7
  path_provider: ^2.1.2
  path: ^1.9.0

  mrz_parser: ^2.0.1

  js: ^0.6.7

  intl: ^0.19.0

dependency_overrides:
  firebase_core_web: ^2.15.0
  firebase_auth_web: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
